services:

  # ── MongoDB ────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: pulseops-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: pulseops
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis-data:/data
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: pulseops-backend:latest
    container_name: pulseops-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus:   '0.75'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: pulseops-frontend:latest
    container_name: pulseops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus:   '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── AI Service ─────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: production
    image: pulseops-ai:latest
    container_name: pulseops-ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env.production
    volumes:
      - ai-models:/app/models   # persist trained models
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout:  15s
      retries:  5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus:   '1.0'
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── n8n ────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: pulseops-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-pulseops123}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_LOG_LEVEL=warn
      - N8N_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - pulseops-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus:   '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pulseops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pulseops-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ── Networks ──────────────────────────────────────
networks:
  pulseops-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Volumes ───────────────────────────────────────
volumes:
  mongo-data:
  mongo-config:
  redis-data:
  ai-models:
  n8n-data:
  nginx-logs: